title: "Blog Musique & Disques d'Occasion"
description: "Guides collectors, sélections vinyles, CD et cassettes audio d'époque."
theme: minima

# Pages à afficher dans le menu de navigation supérieur
header_pages:
  - index.html
  
# Configuration des articles
permalink: /blog/:title/

url: "https://metaloxgit.github.io"
baseurl: "/music-blog"

# Pagination
paginate: 30
paginate_path: "/page:num/"

# Plugins GitHub Pages
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
